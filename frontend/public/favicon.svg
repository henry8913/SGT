<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Tower crane silhouette -->
  <rect x="29" y="6" width="6" height="44" rx="1" fill="#212529"/>
  <rect x="10" y="44" width="44" height="5" rx="1.5" fill="#212529"/>
  <rect x="5" y="49" width="54" height="6" rx="2" fill="#FFB300"/>
  <!-- Jib (horizontal arm) -->
  <rect x="24" y="10" width="34" height="4" rx="1" fill="#FFB300"/>
  <!-- Counter-jib -->
  <rect x="6" y="10" width="18" height="4" rx="1" fill="#343A40"/>
  <!-- Cabin -->
  <rect x="24" y="14" width="10" height="7" rx="1.5" fill="#343A40"/>
  <rect x="26" y="16" width="6" height="4" rx="1" fill="#FFB300"/>
  <!-- Hook line -->
  <line x1="54" y1="14" x2="54" y2="38" stroke="#212529" stroke-width="1.5"/>
  <path d="M50 38 h8 l-2 4 h-4 z" fill="#FFB300"/>
  <!-- Wind indicators -->
  <line x1="46" y1="10" x2="50" y2="6" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="6" x2="54" y2="10" stroke="#FFB300" stroke-width="1" stroke-linecap="round"/>
</svg>
