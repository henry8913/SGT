services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8500:8500"
    volumes:
      - sgt_data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/sgt.db
    command: >
      sh -c "python -m app.seed && python -m app.load_formulas && uvicorn app.main:app --host 0.0.0.0 --port 8500"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sgt_data:
